<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>회원 가입</title>
 <style>
  html, body { height: 100%; }
  body {
   margin: 0;
   min-height: 100vh;
   display: flex;
   justify-content: center;
   align-items: center;
   background: #f8f9fa;
   font-family: "Comic Sans MS", "맑은 고딕", "Malgun Gothic", sans-serif;
  }
  .card {
   width: 360px;
   background: #ffffff;
   border-radius: 12px;
   box-shadow: 0 2px 8px rgba(0,0,0,0.1);
   padding: 28px;
   box-sizing: border-box;
   text-align: left;
  }
  .card h1 {
   margin: 0 0 12px 0;
   font-size: 22px;
   color: #333;
  }
  .field { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  label { font-size: 14px; color: #333; font-weight: bold; }
  input[type="text"], input[type="password"] {
   height: 40px;
   padding: 0 12px;
   border-radius: 12px;
   border: 1px solid #e0e0e0;
   outline: none;
   font-size: 14px;
   background: #fff;
   box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
  }
  .field .hint { font-size: 12px; color: #666; margin-top: -4px; }
  .actions { margin-top: 16px; display: flex; gap: 8px; }
  .btn {
   flex: 1;
   height: 44px;
   border: none;
   border-radius: 12px;
   background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
   color: #ffffff;
   font-size: 15px;
   cursor: pointer;
   font-weight: bold;
   box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
   transition: all 0.3s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2); }
  .btn.secondary { background: linear-gradient(135deg, #a8d8ff 0%, #87ceeb 100%); }
  .btn:active { transform: translateY(1px); }
  .message { margin-top: 12px; font-size: 13px; }
  .error { color: #dc2626; font-weight: bold; }
  .success { color: #32cd32; font-weight: bold; }
 </style>
</head>
<body>
 <div class="card">
  <h1>회원 정보 입력</h1>
  <div class="field">
   <label for="name">이름</label>
   <input id="name" type="text" placeholder="이름을 입력하세요" autocomplete="name">
  </div>
  <div class="field">
   <label for="userId">아이디</label>
   <input id="userId" type="text" placeholder="아이디를 입력하세요" autocomplete="username">
  </div>
  <div class="field">
   <label for="password">비밀번호</label>
   <div class="hint">친구 이름을 맞출 때 사용됩니다</div>
   <input id="password" type="password" placeholder="4자리 숫자" maxlength="4" pattern="[0-9]{4}">
  </div>
  <div class="actions">
   <button id="submit" class="btn">등록</button>
   <button id="back" class="btn secondary">뒤로</button>
  </div>
  <div id="msg" class="message"></div>
 </div>
 <script>
  (function () {
   const BASE_URL = 'https://7bfc4300.whoareyou-4bx.pages.dev';
   const storageKey = 'registeredIds';
   const nameMapKey = 'idToName';
   const passwordMapKey = 'idToPassword';
   const nameInput = document.getElementById('name');
   const idInput = document.getElementById('userId');
   const passwordInput = document.getElementById('password');
   const msg = document.getElementById('msg');

   function loadIds() {
    try { return JSON.parse(localStorage.getItem(storageKey) || '[]'); }
    catch (e) { return []; }
   }

   function saveIds(ids) {
    localStorage.setItem(storageKey, JSON.stringify(ids));
   }

   function loadNameMap() {
    try { return JSON.parse(localStorage.getItem(nameMapKey) || '{}'); }
    catch (e) { return {}; }
   }

   function saveNameMap(map) {
    localStorage.setItem(nameMapKey, JSON.stringify(map));
   }

   function loadPasswordMap() {
    try { return JSON.parse(localStorage.getItem(passwordMapKey) || '{}'); }
    catch (e) { return {}; }
   }

   function savePasswordMap(map) {
    localStorage.setItem(passwordMapKey, JSON.stringify(map));
   }

   function setMessage(text, type) {
    msg.textContent = text;
    msg.className = 'message ' + (type || '');
   }

   passwordInput.addEventListener('input', function(e) {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
   });

   document.getElementById('submit').addEventListener('click', async function () {
    const name = (nameInput.value || '').trim();
    const userId = (idInput.value || '').trim();
    const password = (passwordInput.value || '').trim();

    if (!name) { setMessage('이름을 입력하세요.', 'error'); return; }
    if (!userId) { setMessage('아이디를 입력하세요.', 'error'); return; }
    if (!password) { setMessage('비밀번호를 입력하세요.', 'error'); return; }
    if (password.length !== 4) { setMessage('비밀번호는 4자리 숫자여야 합니다.', 'error'); return; }
    if (!/^[0-9]{4}$/.test(password)) { setMessage('비밀번호는 숫자만 입력 가능합니다.', 'error'); return; }

    // Check duplicate in localStorage first (for quick feedback)
    const ids = loadIds();
    if (ids.includes(userId)) {
     setMessage('이미 등록된 아이디입니다. 다른 아이디를 사용하세요.', 'error');
     return;
    }

    setMessage('등록 중...', 'success');

    try {
     // Register user via API (saves to KV)
     const response = await fetch(BASE_URL + '/api/users', {
      method: 'POST',
      headers: {
       'Content-Type': 'application/json',
      },
      body: JSON.stringify({
       userId: userId,
       name: name,
       password: password
      })
     });

     if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      if (errorData.error && errorData.error.includes('이미 등록된')) {
       setMessage('이미 등록된 아이디입니다. 다른 아이디를 사용하세요.', 'error');
      } else {
       throw new Error(errorData.message || '회원가입 실패');
      }
      return;
     }

     // Also save to localStorage for backward compatibility
     ids.push(userId);
     saveIds(ids);
     const map = loadNameMap();
     map[userId] = name;
     saveNameMap(map);
     const passwordMap = loadPasswordMap();
     passwordMap[userId] = password;
     savePasswordMap(passwordMap);

     setMessage('등록이 완료되었습니다! 페이지로 이동합니다...', 'success');
     setTimeout(function(){
      window.location.href = BASE_URL + '/profile.html?id=' + encodeURIComponent(userId);
     }, 400);
    } catch (error) {
     console.error('Registration error:', error);
     setMessage('등록 중 오류가 발생했습니다: ' + error.message, 'error');
    }
   });

   document.getElementById('back').addEventListener('click', function () {
    window.location.href = BASE_URL + '/index.html';
   });
  })();
 </script>
</body>
</html>
