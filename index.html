<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Who Are You</title>
 <style>
  html, body { height: 100%; }
  body {
   margin: 0;
   min-height: 100vh;
   display: flex;
   justify-content: center;
   align-items: center;
   background: linear-gradient(180deg, #FFE4F0 0%, #FFF8E1 100%);
   font-family: "Comic Sans MS", "맑은 고딕", "Malgun Gothic", sans-serif;
  }
  #app {
   width: 100%;
   display: flex;
   justify-content: center;
   align-items: center;
  }
  .card {
   width: 360px;
   background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.4) 100%);
   backdrop-filter: blur(10px);
   -webkit-backdrop-filter: blur(10px);
   border-radius: 12px;
   border: 1px solid rgba(255, 255, 255, 0.6);
   box-shadow: 0 8px 32px rgba(220, 100, 120, 0.2);
   padding: 28px;
   box-sizing: border-box;
   text-align: left;
  }
  .card h1 {
   margin: 0 0 16px 0;
   font-size: 22px;
   color: #E84A6B;
   text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
  }
  h1 { margin: 0 0 12px 0; font-size: 22px; color: #E84A6B; text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5); }
  h2 { margin: 0 0 8px 0; font-size: 16px; color: #E84A6B; font-weight: bold; text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5); }
  .field {
   display: flex;
   flex-direction: column;
   gap: 8px;
   margin-top: 12px;
  }
  .inputRow { display: flex; gap: 8px; }
  .inputRow input { flex: 1; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; }
  label { font-size: 14px; color: #E84A6B; font-weight: bold; }
  input[type="text"], input[type="password"] {
   height: 40px;
   padding: 0 12px;
   border-radius: 12px;
   border: 1px solid rgba(232, 74, 107, 0.3);
   outline: none;
   font-size: 14px;
   background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.7) 100%);
   backdrop-filter: blur(5px);
   -webkit-backdrop-filter: blur(5px);
   color: #333;
   box-shadow: inset 0 1px 2px rgba(220, 100, 120, 0.15);
  }
  textarea {
   padding: 10px 12px;
   border-radius: 12px;
   border: 1px solid rgba(232, 74, 107, 0.3);
   outline: none;
   font-size: 14px;
   background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.7) 100%);
   backdrop-filter: blur(5px);
   -webkit-backdrop-filter: blur(5px);
   color: #333;
   box-shadow: inset 0 1px 2px rgba(220, 100, 120, 0.15);
   min-height: 96px;
   resize: vertical;
  }
  select {
   border: 1px solid rgba(232, 74, 107, 0.3);
   border-radius: 12px;
   background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.7) 100%);
   backdrop-filter: blur(5px);
   -webkit-backdrop-filter: blur(5px);
   color: #333;
   box-shadow: inset 0 1px 2px rgba(220, 100, 120, 0.15);
  }
  .actions { margin-top: 16px; display: flex; gap: 8px; }
  .btn {
   width: 100%;
   height: 44px;
   border: none;
   border-radius: 12px;
   background: #F25675;
   backdrop-filter: blur(10px);
   -webkit-backdrop-filter: blur(10px);
   color: #ffffff;
   font-size: 15px;
   cursor: pointer;
   font-weight: bold;
   box-shadow: 0 4px 8px rgba(220, 100, 120, 0.3);
   transition: all 0.3s;
   border: 1px solid rgba(255, 255, 255, 0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(242, 86, 117, 0.4); background: #E84A6B; }
  .btn:active { transform: translateY(1px); }
  .btn.inline { width: auto; padding: 0 16px; height: 40px; background: #9BDEAC; }
  .btn.inline:hover { background: #8CD59B; }
  .btn.secondary { background: #9BDEAC; }
  .btn.secondary:hover { background: #8CD59B; box-shadow: 0 6px 12px rgba(155, 222, 172, 0.4); }
  .field .hint { font-size: 12px; color: #E84A6B; margin-top: -4px; }
  .message { margin-top: 12px; font-size: 13px; }
  .error { color: #F25675; font-weight: bold; }
  .success { color: #9BDEAC; font-weight: bold; }
  .wrap { display: flex; flex-direction: column; align-items: center; }
  .titleRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .btnShare { flex: none; height: 32px; padding: 0 12px; font-size: 13px; background: #9BDEAC; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
  .btnShare:hover { background: #8CD59B; }
  /* 친구수집 버튼 전용 스타일 - 작게 만들기 */
  .btnFriendCollection { flex: none; width: 80px; height: 24px; padding: 0 8px; font-size: 11px; background: #9BDEAC; border-radius: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
  .btnFriendCollection:hover { background: #8CD59B; }
  .msg { margin-top: 10px; font-size: 13px; color: #9BDEAC; font-weight: bold; }
  .list { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .list .btnItem { aspect-ratio: 1; border: 1px solid rgba(232, 74, 107, 0.3); background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.7) 100%); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); color: #333; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; box-shadow: 0 2px 4px rgba(220, 100, 120, 0.2); transition: all 0.3s; }
  .list .btnItem:hover { background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.85) 100%); transform: scale(1.02); box-shadow: 0 4px 8px rgba(232, 74, 107, 0.3); }
  .outerActions { margin-top: 12px; width: 540px; display: flex; gap: 8px; justify-content: center; }
  .outerActions.home { width: 360px; }
  hr { border: none; border-top: 1px solid rgba(232, 74, 107, 0.3); }
  .header { font-size: 18px; font-weight: bold; color: #E84A6B; }
  .header .right { color: #E84A6B; margin-left: 8px; font-weight: bold; }
  .section { margin-top: 16px; }
  .box { border: 1px solid rgba(232, 74, 107, 0.3); border-radius: 8px; padding: 12px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.7) 100%); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); white-space: pre-wrap; line-height: 1.6; color: #333; box-shadow: 0 2px 4px rgba(220, 100, 120, 0.2); }
  .row input.password { flex: none; width: 80px; }
  .subtle { color: #E84A6B; font-size: 13px; margin-top: 6px; }
  .errorMsg { color: #F25675; font-size: 13px; margin-top: 6px; font-weight: bold; }
  /* 페이지별 너비 조정 */
  .card[data-page="profile"] { width: 540px; }
  .card[data-page="info"] { width: 520px; }
  .card[data-page="mytomodacchi"] { width: 640px; }
 </style>
</head>
<body>
 <div id="app"></div>
 
 <script src="js/config.js"></script>
 <script src="js/utils.js"></script>
 <script src="js/router.js"></script>
 <script src="js/pages/home.js"></script>
 <script src="js/pages/register.js"></script>
 <script src="js/pages/profile.js"></script>
 <script src="js/pages/info.js"></script>
 <script src="js/pages/mytomodacchi.js"></script>
 
 <script>
  // 라우터에 페이지 등록
  router.register('/home', HomePage);
  router.register('/', HomePage);
  router.register('/register', RegisterPage);
  router.register('/profile', ProfilePage);
  router.register('/info', InfoPage);
  router.register('/mytomodacchi', MyTomodacchiPage);
  
  // 라우터 초기화
  document.addEventListener('DOMContentLoaded', () => {
   router.init();
  });
 </script>
</body>
</html>
