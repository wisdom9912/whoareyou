<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>제출폼 보기</title>
 <style>
  html, body { height: 100%; }
  body {
   margin: 0;
   min-height: 100vh;
   display: flex;
   justify-content: center;
   align-items: center;
   background: #f8f9fa;
   font-family: "Comic Sans MS", "맑은 고딕", "Malgun Gothic", sans-serif;
  }
  .card {
   width: 640px;
   background: #ffffff;
   border-radius: 12px;
   box-shadow: 0 2px 8px rgba(0,0,0,0.1);
   padding: 28px;
   box-sizing: border-box;
   text-align: left;
  }
  .header { font-size: 18px; font-weight: bold; color: #333; }
  .header .right { color: #333; margin-left: 8px; font-weight: bold; }
  .section { margin-top: 16px; }
  .section h2 { margin: 0 0 8px 0; font-size: 16px; color: #333; font-weight: bold; }
  .box { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; background: #fafafa; white-space: pre-wrap; line-height: 1.6; color: #555; }
  .actions { margin-top: 16px; display: flex; gap: 8px; }
  .btn { height: 40px; border: none; border-radius: 12px; background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%); color: #fff; padding: 0 16px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); transition: all 0.3s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2); }
  .btn:active { transform: translateY(1px); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; height: 40px; padding: 0 12px; border: 1px solid #e0e0e0; border-radius: 12px; background: #fff; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
  .row input.password { flex: none; width: 80px; }
  .subtle {    color: #666; font-size: 13px; margin-top: 6px; }
  .errorMsg { color: #dc2626; font-size: 13px; margin-top: 6px; font-weight: bold; }
 </style>
</head>
<body>
 <div class="card">
  <div class="header"><span id="left"></span><span id="right" class="right"></span></div>
  <div class="section">
   <h2>첫인상</h2>
   <div id="first" class="box"></div>
  </div>
  <div class="section">
   <h2>현 인상</h2>
   <div id="current" class="box"></div>
  </div>
  <div class="section" id="guessSection">
   <h2>나는 누구일까요?</h2>
   <div class="row">
    <input id="guessInput" type="text" placeholder="이 사람이 누구인지 입력하세요">
    <input id="passwordInput" type="password" class="password" placeholder="비밀번호" maxlength="4" pattern="[0-9]{4}">
    <button id="guessBtn" class="btn">입력</button>
   </div>
   <div id="guessInfo" class="subtle"></div>
   <div id="passwordError" class="errorMsg"></div>
  </div>
  <div class="section" id="fixedGuessSection" style="display:none;">
   <h2 id="fixedGuessTitle"></h2>
   <div id="fixedGuess" class="box"></div>
  </div>
  <div id="answerSection" class="section" style="display:none;">
   <h2>정답은?</h2>
   <div id="answer" class="box"></div>
  </div>
  <div class="actions">
   <button id="back" class="btn">다른 친구 확인하기</button>
  </div>
 </div>
 <script>
  (function(){
   const BASE_URL = 'https://7bfc4300.whoareyou-4bx.pages.dev';
   const params = new URLSearchParams(location.search);
   const userId = params.get('id') || '';
   const idx = parseInt(params.get('idx') || '-1', 10);
   const nameFromQuery = params.get('name') || '';
   const nameMapKey = 'idToName';

   function loadNameMap() {
    try { return JSON.parse(localStorage.getItem(nameMapKey) || '{}'); }
    catch (e) { return {}; }
   }
   async function loadOpinions(){
    try {
     const response = await fetch(BASE_URL + '/api/opinions?userId=' + encodeURIComponent(userId));
     if (!response.ok) {
      throw new Error('API 요청 실패: ' + response.status);
     }
     const data = await response.json();
     return data.opinions || [];
    } catch (e) {
     console.error('Error loading opinions:', e);
     throw e;
    }
   }
   
   async function loadGuess() {
    try {
     const response = await fetch(BASE_URL + '/api/guesses?userId=' + encodeURIComponent(userId) + '&idx=' + idx);
     if (response.ok) {
      const data = await response.json();
      return data.guess || null;
     }
     return null;
    } catch (e) {
     console.error('Error loading guess:', e);
     return null;
    }
   }
   
   async function saveGuess(guess) {
    try {
     const response = await fetch(BASE_URL + '/api/guesses', {
      method: 'POST',
      headers: {
       'Content-Type': 'application/json',
      },
      body: JSON.stringify({
       userId: userId,
       idx: idx,
       guess: guess
      })
     });
     
     if (!response.ok) {
      throw new Error('추측 저장 실패');
     }
     
     return true;
    } catch (e) {
     console.error('Error saving guess:', e);
     throw e;
    }
   }

   const map = loadNameMap();
   const accountName = nameFromQuery || map[userId] || '(이름 미확인)';
   
   const guessSection = document.getElementById('guessSection');
   const fixedSection = document.getElementById('fixedGuessSection');
   const fixedGuessEl = document.getElementById('fixedGuess');
   const fixedGuessTitleEl = document.getElementById('fixedGuessTitle');
   const guessInfo = document.getElementById('guessInfo');
   const passwordInput = document.getElementById('passwordInput');
   const passwordError = document.getElementById('passwordError');
   const leftHeaderEl = document.getElementById('left');

   function loadPasswordMap() {
    try { return JSON.parse(localStorage.getItem('idToPassword') || '{}'); }
    catch (e) { return {}; }
   }

   function hasFinalConsonant(str) {
    if (!str || str.length === 0) return false;
    const lastChar = str[str.length - 1];
    const code = lastChar.charCodeAt(0);
    return (code >= 0xAC00 && code <= 0xD7A3) && ((code - 0xAC00) % 28 !== 0);
   }

   function lockGuess(guess, friendName){
    fixedGuessEl.textContent = guess;
    const accountHasJosa = hasFinalConsonant(accountName);
    const accountJosa = accountHasJosa ? accountName + '이' : accountName + '가';
    fixedGuessTitleEl.textContent = accountJosa + ' 입력한 답';
    guessSection.style.display = 'none';
    fixedSection.style.display = '';
    var ansSec = document.getElementById('answerSection');
    ansSec.style.display = '';
    if (friendName && friendName !== '???') {
     const friendHasJosa = hasFinalConsonant(friendName);
     const friendJosa = friendHasJosa ? friendName + '이' : friendName + '가';
     leftHeaderEl.textContent = friendJosa + ' 생각하는';
    }
   }

   function updateUI(item, savedGuess) {
    const friendName = item.friendName || '???';
    document.getElementById('left').textContent = '???가 생각하는';
    document.getElementById('right').textContent = accountName;
    document.getElementById('first').textContent = item.firstImpression || '';
    document.getElementById('current').textContent = item.currentImpression || '';
    document.getElementById('answer').textContent = friendName;

    if (savedGuess) {
     lockGuess(savedGuess, friendName);
    }
   }

   // Load opinions and guess asynchronously and update UI
   Promise.all([loadOpinions(), loadGuess()]).then(function(results) {
    const opinions = results[0];
    const savedGuess = results[1];
    const item = opinions[idx] || {};
    updateUI(item, savedGuess);
   }).catch(function(err) {
    console.error('Error:', err);
    document.getElementById('first').textContent = '데이터를 불러오는 중 오류가 발생했습니다.';
    document.getElementById('current').textContent = '잠시 후 다시 시도해주세요.';
   });

   passwordInput.addEventListener('input', function(e) {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    passwordError.textContent = '';
   });

   document.getElementById('guessBtn').addEventListener('click', async function(){
    const input = document.getElementById('guessInput');
    const password = (passwordInput.value || '').trim();
    const val = (input.value || '').trim();

    if (!password) {
     passwordError.textContent = '비밀번호를 입력하세요.';
     guessInfo.textContent = '';
     return;
    }
    if (password.length !== 4) {
     passwordError.textContent = '비밀번호는 4자리 숫자여야 합니다.';
     guessInfo.textContent = '';
     return;
    }
    if (!/^[0-9]{4}$/.test(password)) {
     passwordError.textContent = '비밀번호는 숫자만 입력 가능합니다.';
     guessInfo.textContent = '';
     return;
    }

    const passwordMap = loadPasswordMap();
    const savedPassword = passwordMap[userId];
    if (!savedPassword || savedPassword !== password) {
     passwordError.textContent = '비밀번호가 일치하지 않습니다. 답을 맞출 수 없습니다.';
     guessInfo.textContent = '';
     return;
    }

    if (!val) {
     passwordError.textContent = '';
     guessInfo.textContent = '이름을 입력하세요.';
     return;
    }

    try {
     passwordError.textContent = '';
     guessInfo.textContent = '저장 중...';
     
     // Save guess to Cloudflare
     await saveGuess(val);
     
     // Get the current item to pass friendName
     const opinions = await loadOpinions();
     const currentItem = opinions[idx] || {};
     lockGuess(val, currentItem.friendName);
     guessInfo.textContent = '';
    } catch (e) {
     console.error('Error saving guess:', e);
     guessInfo.textContent = '저장 중 오류가 발생했습니다. 다시 시도해주세요.';
    }
   });

   document.getElementById('back').addEventListener('click', function(){
    const url = BASE_URL + '/profile.html?id=' + encodeURIComponent(userId) + (accountName ? ('&name=' + encodeURIComponent(accountName)) : '');
    location.href = url;
   });
  })();
 </script>
 </body>
 </html>
